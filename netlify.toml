[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # sharp ships a native binary that must not be bundled
  external_node_modules = ["sharp"]

# The service worker must always be revalidated so app updates reach phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The page itself must always be fresh so it points at the current code files
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Code files have a unique name per version and can be kept for good
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
